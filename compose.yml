services:
  myapplication:
    container_name: app-cont
    image: mywebapp:v1
    ports:
      - "1111:8080"
    depends_on:
      - devopsdb

  devopsdb:
    container_name: devopsdb
    image: mydb:v1
    ports:
      - "1112:3306"
    volumes:
      - userdata:/var/lib/mysql/
    environment:
      MYSQL_ROOT_PASSWORD: "devopspassword"

volumes:
  userdata:
